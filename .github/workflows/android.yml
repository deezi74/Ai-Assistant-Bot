name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LLAMA_CPP_TAG: b12017
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "sdk.dir=${SDK}" > local.properties

      - name: Cache llama.cpp checkout
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/llama.cpp
          key: llama-cpp-${{ env.LLAMA_CPP_TAG }}

      - name: Fetch llama.cpp ${{ env.LLAMA_CPP_TAG }}
        run: |
          if [ ! -f app/src/main/cpp/llama.cpp/CMakeLists.txt ]; then
            git clone --depth 1 --branch "${LLAMA_CPP_TAG}" https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          fi

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pocketagent-debug-keystore-v1

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETAGENT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "POCKETAGENT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (agent core)
        run: ./gradlew --no-daemon :agent-core:test

      - name: Build release APK
        env:
          POCKETAGENT_KEYSTORE_PASSWORD: ${{ secrets.POCKETAGENT_KEYSTORE_PASSWORD }}
          POCKETAGENT_KEY_ALIAS: ${{ secrets.POCKETAGENT_KEY_ALIAS }}
          POCKETAGENT_KEY_PASSWORD: ${{ secrets.POCKETAGENT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="TruAgent-${GITHUB_RUN_NUMBER}-arm64.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TruAgent-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: TruAgent build ${{ github.run_number }}
          body: |
            Installable arm64-v8a APK built from ${{ github.sha }}.
            Download the .apk on your phone and open it (allow "Install unknown apps" for your browser or file manager).
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
